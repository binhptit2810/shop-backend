plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.shop'
version = '0.0.1-SNAPSHOT'

ext {
    set('springAiVersion', "1.0.0-M1")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // Spring Boot Core Starter Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Spring Boot Starter Mail for sending OTP emails
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // Spring Boot Data JPA for database operations
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Validation for input validation in DTOs
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // JWT library (JJWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    // Flyway for database migration
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    
    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    
    // Spring AI OpenAI (used for Gemini compatibility)
    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'
    
    // Cloudinary
    implementation 'com.cloudinary:cloudinary-http44:1.38.0'
    
    // Lombok to reduce boilerplate
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // MySQL Driver
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.fork = false
}

bootRun {
    if (file(".env").exists()) {
        file(".env").readLines().each {
            def line = it.trim()
            if (!line.isEmpty() && !line.startsWith("#")) {
                def pos = line.indexOf("=")
                if (pos > 0) {
                    def key = line.substring(0, pos).trim()
                    def value = line.substring(pos + 1).trim()
                    if ((value.startsWith("\"") && value.endsWith("\"")) || (value.startsWith("'") && value.endsWith("'"))) {
                        value = value.substring(1, value.length() - 1)
                    }
                    environment key, value
                }
            }
        }
    }
}

